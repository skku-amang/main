# TODO: namespace를 ArgoCD Application에서 지정하고 여기서 제거 검토
# ref: https://github.com/manamana32321/homelab/tree/main/k8s/argocd/applications/apps/amang
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: amang-api-staging

resources:
  - namespace.yaml
  - ../../base
  - ingress.yaml
  - sealed-secret.yaml

configMapGenerator:
  - name: api-config
    behavior: merge
    literals:
      - S3_ENDPOINT=https://s3.amang.staging.json-server.win
      - COOKIE_SAMESITE=none
      - COOKIE_DOMAIN=amang.staging.json-server.win
      - NODE_ENV=development
      - REDIS_HOST=redis.amang-redis-staging.svc.cluster.local
