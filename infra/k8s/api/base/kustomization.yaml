apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - migrate-job.yaml

configMapGenerator:
  - name: api-config
    literals:
      - ACCESS_TOKEN_EXPIRES_IN_SECONDS=3600
      - REFRESH_TOKEN_EXPIRES_IN_SECONDS=604800
      - S3_REGION=ap-northeast-2
      - S3_BUCKET=amang
