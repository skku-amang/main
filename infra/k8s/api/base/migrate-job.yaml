apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  labels:
    app: api
    job-type: migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: api-job
        job-type: migrate
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: migrate
          # 태그는 Kargo가 env/<stage> 브랜치의 overlay images:로 고정. 없는 태그라 overlay에 빠지면 바로 실패
          image: ghcr.io/skku-amang/amang-api:kargo-managed
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - cd packages/database && npx prisma migrate deploy
          envFrom:
            - secretRef:
                name: amang-db-credentials
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
