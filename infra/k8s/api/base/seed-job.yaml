apiVersion: batch/v1
kind: Job
metadata:
  name: db-seed
  labels:
    app: api
    job-type: seed
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: api-job
        job-type: seed
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: seed
          # 수동 실행 전용 (kustomization 미포함). 실행 시 태그를 env/<stage> 브랜치 overlay의 newTag로 바꿀 것
          image: ghcr.io/skku-amang/amang-api:kargo-managed
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - cd packages/database && npx ts-node prisma/seed.ts
          env:
            - name: SEED_TYPE
              value: "test"
          envFrom:
            - secretRef:
                name: api-secrets
            - secretRef:
                name: amang-db-credentials
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
