apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: api
          # 태그는 Kargo가 env/<stage> 브랜치의 overlay images:로 고정. 없는 태그라 overlay에 빠지면 바로 실패
          image: ghcr.io/skku-amang/amang-api:kargo-managed
          imagePullPolicy: IfNotPresent
          lifecycle:
            # Service endpoint에서 빠질 시간을 준 뒤 SIGTERM 전달 (그 사이 요청 계속 처리)
            preStop:
              sleep:
                seconds: 5
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secrets
            - secretRef:
                name: amang-db-credentials
            - secretRef:
                name: minio-s3-credentials
            - secretRef:
                name: redis-credentials
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            limits:
              # Node는 스레드 하나라 순간적으로 코어 하나를 쓴다. 500m이면 평균이 낮아도
              # 몰릴 때마다 강제로 멈춰(7일 throttling api 6.5%·web 10%) 응답이 늦어진다
              cpu: 1000m
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 256Mi
