apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: api
          image: ghcr.io/skku-amang/amang-api:latest
          imagePullPolicy: IfNotPresent
          lifecycle:
            # Service endpoint에서 빠질 시간을 준 뒤 SIGTERM 전달 (그 사이 요청 계속 처리)
            preStop:
              sleep:
                seconds: 5
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secrets
            - secretRef:
                name: amang-db-credentials
            - secretRef:
                name: minio-s3-credentials
            - secretRef:
                name: redis-credentials
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 256Mi
