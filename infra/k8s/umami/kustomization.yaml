# 방문 통계 (Umami). staging·production 사이트를 한 인스턴스에 같이 등록하므로 overlay 없음
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: amang
    includeSelectors: false

resources:
  - sealed-credentials.yaml
  - postgres
  - deployment.yaml
  - service.yaml
  - ingress.yaml
