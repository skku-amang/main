# Freight의 커밋에서 infra/k8s/api(base + overlays)를 그대로 env/<stage> 브랜치로 복사하고,
# 해당 stage overlay의 이미지 태그만 Freight 것으로 바꿔 커밋한다.
# ArgoCD 앱 api-<stage>는 env/<stage> 브랜치의 infra/k8s/api/overlays/<stage>를 바라본다
# (homelab k8s/argocd/applications/apps/amang/api.yaml). base 변경도 승격을 거쳐야 반영된다.
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: promote-api
  namespace: amang
spec:
  vars:
    - name: gitRepo
      value: https://github.com/skku-amang/main
    - name: imageRepo
      value: ghcr.io/skku-amang/amang-api
  steps:
    - uses: git-clone
      config:
        repoURL: ${{ vars.gitRepo }}
        checkout:
          - commit: ${{ commitFrom(vars.gitRepo).ID }}
            path: ./src
          - branch: env/${{ ctx.stage }}
            create: true
            path: ./out
    - uses: git-clear
      config:
        path: ./out
    - uses: copy
      config:
        inPath: ./src/infra/k8s/api
        outPath: ./out/infra/k8s/api
    - uses: kustomize-set-image
      as: update-image
      config:
        path: ./out/infra/k8s/api/overlays/${{ ctx.stage }}
        images:
          - image: ${{ vars.imageRepo }}
            tag: ${{ imageFrom(vars.imageRepo).Tag }}
    - uses: git-commit
      as: commit
      config:
        path: ./out
        message: ${{ task.outputs['update-image'].commitMessage }}
    - uses: git-push
      config:
        path: ./out
    - uses: argocd-update
      config:
        apps:
          - name: api-${{ ctx.stage }}
            sources:
              - repoURL: ${{ vars.gitRepo }}
                desiredRevision: ${{ task.outputs.commit.commit }}
