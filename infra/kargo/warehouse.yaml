# main의 커밋 하나 = Freight 하나. 그 커밋에서 빌드된 API 이미지와 짝이 맞을 때만 만든다.
# 같은 커밋의 web(Vercel) 빌드는 promote-web이 커밋 SHA로 찾는다.
# (이름이 api인 건 web 통합 전부터 쓰던 것. 바꾸면 Freight 이력이 끊김)
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: api
  namespace: amang
spec:
  interval: 5m0s
  subscriptions:
    - image:
        repoURL: ghcr.io/skku-amang/amang-api
        # build-image.yml이 붙이는 <커밋시각 UTC>-<짧은 SHA> 태그. 문자열 정렬 = 시간순
        imageSelectionStrategy: Lexical
        allowTagsRegexes:
          - ^\d{14}-[0-9a-f]{7}$
        discoveryLimit: 10
    - git:
        repoURL: https://github.com/skku-amang/main
        branch: main
        discoveryLimit: 10
  # 커밋이 들어온 직후엔 이미지가 아직 없으므로, 그 커밋의 이미지가 올라올 때까지 Freight를 만들지 않는다.
  # CI가 실패해 이미지가 없는 커밋은 Freight가 안 생김 = 배포 불가
  freightCreationCriteria:
    expression: |
      imageFrom('ghcr.io/skku-amang/amang-api').Tag endsWith commitFrom('https://github.com/skku-amang/main').ID[0:7]
