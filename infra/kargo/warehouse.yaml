# main의 커밋 하나 = Freight 하나. 그 커밋에서 빌드된 API·web 이미지가 모두 있을 때만 만든다.
# web은 NEXT_PUBLIC_*가 빌드 때 박혀 환경별 이미지 2개(amang-web-staging/-production)를 같은 Freight로 묶는다.
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: main
  namespace: amang
spec:
  interval: 5m0s
  subscriptions:
    - image:
        repoURL: ghcr.io/skku-amang/amang-api
        # build-image.yml이 붙이는 <커밋시각 UTC>-<짧은 SHA> 태그. 문자열 정렬 = 시간순
        imageSelectionStrategy: Lexical
        allowTagsRegexes:
          - ^\d{14}-[0-9a-f]{7}$
        discoveryLimit: 10
    - image:
        repoURL: ghcr.io/skku-amang/amang-web-staging
        imageSelectionStrategy: Lexical
        allowTagsRegexes:
          - ^\d{14}-[0-9a-f]{7}$
        discoveryLimit: 10
    - image:
        repoURL: ghcr.io/skku-amang/amang-web-production
        imageSelectionStrategy: Lexical
        allowTagsRegexes:
          - ^\d{14}-[0-9a-f]{7}$
        discoveryLimit: 10
    - git:
        repoURL: https://github.com/skku-amang/main
        branch: main
        discoveryLimit: 10
  # 커밋이 들어온 직후엔 이미지가 아직 없으므로, 그 커밋의 이미지가 올라올 때까지 Freight를 만들지 않는다.
  # CI가 실패해 이미지가 없는 커밋은 Freight가 안 생김 = 배포 불가
  freightCreationCriteria:
    expression: |
      imageFrom('ghcr.io/skku-amang/amang-api').Tag endsWith commitFrom('https://github.com/skku-amang/main').ID[0:7] &&
      imageFrom('ghcr.io/skku-amang/amang-web-staging').Tag endsWith commitFrom('https://github.com/skku-amang/main').ID[0:7] &&
      imageFrom('ghcr.io/skku-amang/amang-web-production').Tag endsWith commitFrom('https://github.com/skku-amang/main').ID[0:7]
