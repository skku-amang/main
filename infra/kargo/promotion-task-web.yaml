# production 전용 (staging web은 홈랩 K3s, promote-k8s). production도 홈랩으로 옮기면 이 파일을 지운다 (#749).
# Freight 커밋에서 Vercel git 연동이 만든 production 빌드를 찾아 promote한다. 빌드를 새로 하지 않는다
# (auto_assign_custom_domains=false라 자동 연결 안 됨).
# 토큰: sealed-vercel-token.yaml (Vercel 토큰 kargo-amang)
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: promote-web
  namespace: amang
spec:
  vars:
    - name: gitRepo
      value: https://github.com/skku-amang/main
    # infra/terraform/vercel의 vercel_project.web / var.vercel_team_id
    - name: vercelProject
      value: prj_Be6ghVdveO0bbNJZrfyTFnQsXLRo
    - name: vercelTeam
      value: team_aDiKenl6xun665nVWV49POd4
  steps:
    # 빌드가 끝날 때까지 polling. 빌드 실패면 바로 실패
    - uses: http
      as: find
      retry:
        timeout: 30m
      config:
        url: https://api.vercel.com/v6/deployments
        headers:
          - name: Authorization
            value: Bearer ${{ secret('vercel').token }}
        queryParams:
          - name: projectId
            value: ${{ vars.vercelProject }}
          - name: teamId
            value: ${{ vars.vercelTeam }}
          - name: sha
            value: ${{ commitFrom(vars.gitRepo).ID }}
          - name: target
            value: production
        pollInterval: 20s
        successExpression: response.status == 200 && len(response.body.deployments) > 0 && response.body.deployments[0].state == "READY"
        failureExpression: response.status >= 400 || (len(response.body.deployments) > 0 && response.body.deployments[0].state in ["ERROR", "CANCELED"])
        outputs:
          - name: id
            fromExpression: response.body.deployments[0].uid
          - name: url
            fromExpression: response.body.deployments[0].url
          - name: inspectorUrl
            fromExpression: response.body.deployments[0].inspectorUrl
    # 409 = 이미 현재 production 배포 (같은 Freight 재승격)
    - uses: http
      as: promote-production
      config:
        method: POST
        url: https://api.vercel.com/v10/projects/${{ vars.vercelProject }}/promote/${{ task.outputs.find.id }}
        headers:
          - name: Authorization
            value: Bearer ${{ secret('vercel').token }}
        queryParams:
          - name: teamId
            value: ${{ vars.vercelTeam }}
        successExpression: response.status == 201 || response.status == 409
    # 지금 이 stage에 연결된 web 배포를 Stage status에 기록 (kargo get stage / kubectl로 확인)
    - uses: set-metadata
      as: record-web-deployment
      config:
        updates:
          - kind: Stage
            name: ${{ ctx.stage }}
            values:
              web:
                commit: ${{ commitFrom(vars.gitRepo).ID }}
                deploymentId: ${{ task.outputs.find.id }}
                url: https://${{ task.outputs.find.url }}
                inspector: ${{ task.outputs.find.inspectorUrl }}
