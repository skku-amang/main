# 로컬 개발용 AI 에이전트 계정 (특정 AI 도구에 묶이지 않음). 권한은 Kargo 기본 kargo-promoter: 보기 + 승격
# 토큰은 아래 Secret에 쿠버네티스가 채운다. 꺼내는 법은 .envrc.local.example Kargo 블록
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-agent
  namespace: amang
  annotations:
    kargo.akuity.io/description: 로컬 개발용 AI 에이전트 (보기 + 승격)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-agent
  namespace: amang
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kargo-promoter
subjects:
  - kind: ServiceAccount
    name: ai-agent
    namespace: amang
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-agent-token
  namespace: amang
  annotations:
    kubernetes.io/service-account.name: ai-agent
type: kubernetes.io/service-account-token
