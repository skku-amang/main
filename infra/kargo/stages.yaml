apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: staging
  namespace: amang
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: main
      sources:
        direct: true
  promotionTemplate:
    spec:
      # API·web 모두 홈랩 K3s (promote-k8s가 api 먼저 sync, 그다음 web)
      steps:
        - task:
            name: promote-k8s
---
# staging을 통과한 Freight만 승격 가능
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: production
  namespace: amang
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: main
      sources:
        stages:
          - staging
  promotionTemplate:
    spec:
      # API·web 모두 홈랩 K3s (promote-k8s가 api 먼저 sync, 그다음 web)
      steps:
        - task:
            name: promote-k8s
