apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: amang-api-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: api-config-m892tkfkdk
        - secretRef:
            name: api-secrets
        - secretRef:
            name: amang-db-credentials
        - secretRef:
            name: minio-s3-credentials
        - secretRef:
            name: redis-credentials
        image: ghcr.io/skku-amang/amang-api:20261014143202-23a7b67
        imagePullPolicy: IfNotPresent
        lifecycle:
          preStop:
            sleep:
              seconds: 5
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        name: api
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
      nodeSelector:
        kubernetes.io/arch: amd64
