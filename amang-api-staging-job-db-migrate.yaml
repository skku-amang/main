apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
  labels:
    app: api
    job-type: migrate
  name: db-migrate
  namespace: amang-api-staging
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: api-job
        job-type: migrate
    spec:
      containers:
      - command:
        - sh
        - -c
        - cd packages/database && npx prisma migrate deploy
        envFrom:
        - secretRef:
            name: amang-db-credentials
        image: ghcr.io/skku-amang/amang-api:20261014143202-23a7b67
        imagePullPolicy: Always
        name: migrate
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
      nodeSelector:
        kubernetes.io/arch: amd64
      restartPolicy: Never
  ttlSecondsAfterFinished: 300
