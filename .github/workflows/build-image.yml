name: Build and Push Docker Images

on:
  # CI(lint/type/test) 통과 후 ci.yml이 호출한다. 직접 push 트리거를 걸면
  # 검사 결과와 무관하게 이미지가 만들어져 Kargo가 staging까지 자동 승격한다.
  workflow_call:
    inputs:
      push:
        description: "레지스트리에 올릴지 여부. PR에서는 false로 호출해 빌드 검증만 한다"
        type: boolean
        default: true
  # 레지스트리 일시 장애 등으로 push만 실패했을 때 검사 재실행 없이 재시도
  workflow_dispatch:
    inputs:
      push:
        description: "레지스트리에 올릴지 여부"
        type: boolean
        default: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false # 하나 실패해도 다른 것들 계속 실행
      matrix:
        app:
          # web은 NEXT_PUBLIC_*가 빌드 때 박혀서 환경마다 이미지가 따로다 (apps/web/env/*.env).
          # Kargo Warehouse가 같은 커밋의 두 이미지를 한 Freight로 묶는다
          - name: web-staging
            dockerfile: apps/web/Dockerfile
            build-args: APP_ENV=staging
          - name: web-production
            dockerfile: apps/web/Dockerfile
            build-args: APP_ENV=production
          - name: api
            dockerfile: apps/api/Dockerfile
            build-args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Kargo Warehouse가 문자열 정렬로 최신 이미지를 고르도록 <커밋시각 UTC>-<짧은 SHA> 태그를 붙인다
      # (infra/kargo/warehouse.yaml). 커밋 시각이라 재실행해도 같은 태그
      - name: Compute sortable tag
        id: sortable
        run: echo "tag=$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.app.name }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.app.dockerfile }}
          platforms: linux/amd64
          push: ${{ inputs.push }}
          tags: |
            ghcr.io/skku-amang/amang-${{ matrix.app.name }}:${{ github.sha }}
            ghcr.io/skku-amang/amang-${{ matrix.app.name }}:${{ steps.sortable.outputs.tag }}
          build-args: ${{ matrix.app.build-args }}
          # scope 없으면 matrix 항목끼리 같은 캐시를 덮어쓴다
          cache-from: type=gha,scope=${{ matrix.app.name }}
          cache-to: ${{ inputs.push && format('type=gha,mode=max,scope={0}', matrix.app.name) || '' }}
