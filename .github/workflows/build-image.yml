name: Build and Push Docker Images

on:
  # CI(lint/type/test) 통과 후 ci.yml이 호출한다. 직접 push 트리거를 걸면
  # 검사 결과와 무관하게 이미지가 만들어져 :latest로 프로덕션까지 흘러간다.
  workflow_call:
  # 레지스트리 일시 장애 등으로 push만 실패했을 때 검사 재실행 없이 재시도
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false # 하나 실패해도 다른 것들 계속 실행
      matrix:
        app:
          # web은 Vercel로 배포하므로 주석 처리
          # - name: web
          #   dockerfile: apps/web/Dockerfile
          #   build-args: |
          #     NEXT_PUBLIC_API_URL=https://api.amang.json-server.win
          - name: api
            dockerfile: apps/api/Dockerfile
            build-args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.app.name }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.app.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/skku-amang/amang-${{ matrix.app.name }}:${{ github.sha }}
            ghcr.io/skku-amang/amang-${{ matrix.app.name }}:latest
          build-args: ${{ matrix.app.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
