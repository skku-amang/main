name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # 문서만 바뀐 PR은 검사·이미지 빌드를 건너뛴다. 필수 체크라 job은 그대로 돌고 step만 skip
  # (workflow paths-ignore나 job if는 체크가 안 떠서 머지가 막힘).
  # main push는 항상 돈다 — Kargo는 최신 main 커밋의 이미지가 있어야 Freight를 만든다 (infra/kargo/warehouse.yaml)
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '!docs/**'
              - '!**/*.md'

  verify:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v7

      - name: Install pnpm
        if: needs.changes.outputs.code == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: pnpm install

      - name: Generate Prisma Client
        if: needs.changes.outputs.code == 'true'
        run: pnpm turbo db:generate

      - name: Run Lint & Type Check
        if: needs.changes.outputs.code == 'true'
        run: pnpm turbo lint check-types

      - name: Check Format
        if: needs.changes.outputs.code == 'true'
        run: pnpm turbo format

      # check-types가 ^build에 의존하므로 packages가 이미 빌드됨
      # test가 ^build에 의존하므로 api도 빌드됨
      - name: Run Tests
        if: needs.changes.outputs.code == 'true'
        run: pnpm turbo test

  build-image:
    needs: [changes, verify]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      # PR에서는 빌드 검증만 하고 레지스트리에는 올리지 않는다
      push: ${{ github.event_name == 'push' }}
      skip: ${{ needs.changes.outputs.code != 'true' }}
