name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma Client
        run: pnpm turbo db:generate

      - name: Run Lint & Type Check
        run: pnpm turbo lint check-types

      - name: Check Format
        run: pnpm turbo format

      # check-types가 ^build에 의존하므로 packages가 이미 빌드됨
      # test가 ^build에 의존하므로 api도 빌드됨
      - name: Run Tests
        run: pnpm turbo test

      # Web은 Vercel에서 빌드 및 배포를 처리하므로 여기서는 제외

  build-image:
    needs: verify
    # PR에서는 이미지를 만들지 않는다 (main에 들어간 결과물만 배포 대상)
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
