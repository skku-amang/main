name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  # 문서(docs/, 루트 *.md)만 바뀐 PR은 검사·이미지 빌드를 건너뛴다
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '!docs/**'
              - '!*.md'

  verify:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma Client
        run: pnpm turbo db:generate

      - name: Run Lint & Type Check
        run: pnpm turbo lint check-types

      - name: Check Format
        run: pnpm turbo format

      # check-types가 ^build에 의존하므로 packages가 이미 빌드됨
      # test가 ^build에 의존하므로 api도 빌드됨
      - name: Run Tests
        run: pnpm turbo test

  build-image:
    needs: [changes, verify]
    # matrix job은 건너뛰면 필수 체크 이름이 안 생겨 머지가 막히므로 job은 돌리고 빌드 step만 skip
    if: ${{ !failure() && !cancelled() }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      # PR에서는 빌드 검증만 하고 레지스트리에는 올리지 않는다
      push: ${{ github.event_name == 'push' }}
      skip: ${{ needs.changes.outputs.code != 'true' }}
